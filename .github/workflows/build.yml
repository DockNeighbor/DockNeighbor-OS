name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# A PUBLIC repo: GitHub-hosted runners only, never self-hosted (a fork PR could run code on it), and no secrets.
permissions:
  contents: read

jobs:
  # station/ is the station image's OpenWrt source as published here: prove it is still buildable source.
  station-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -eu
          for f in scripts/check-station-inputs.sh station/openwrt/files/etc/rc.button/reset; do sh -n "$f"; done
      - name: Host tools (OpenWrt's build prerequisites)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip file \
            python3 python3-setuptools
      - name: Pinned OpenWrt; the board patch applies; the config selects the M2 with it and not without it
        run: sh scripts/check-station-inputs.sh
