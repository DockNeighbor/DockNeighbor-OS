name: Release

# A hub-lite OS release: push a tag `hub-lite-os-v<DN_OS_VERSION>`. Builds the image for EVERY board of the profile
# (profiles/hub-lite/boards/), signs each board's manifest with the DockNeighbor OS release key (fp 3420e953f030f5a8),
# publishes one versioned release, then points the rolling `channel-hub-lite` release at it: one signed manifest per
# board, `<device>.json`, the URL baked into that board's image, which its dn-os-upgrade reads (level 2).
# Only a maintainer can push a tag, and fork PRs never see secrets. The builds see no secrets at all.
on:
  push:
    tags: ['hub-lite-os-v*']

concurrency:
  group: release-hub-lite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      boards: ${{ steps.boards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the profile's version
        run: |
          set -eu
          . profiles/hub-lite/profile.env
          [ "$GITHUB_REF_NAME" = "hub-lite-os-v$DN_OS_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME != hub-lite-os-v$DN_OS_VERSION (profiles/hub-lite/profile.env)"; exit 1; }
      - name: Boards
        id: boards
        run: |
          set -eu
          root=$PWD; . scripts/hub-lite-board.sh
          for b in $(hub_lite_boards); do hub_lite_load "$b"; done
          echo "list=$(hub_lite_boards | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        board: ${{ fromJSON(needs.tag.outputs.boards) }}
    name: build (${{ matrix.board }})
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends $(cat profiles/hub-lite/build-deps)
      - uses: actions/cache@v4
        with:
          path: build/hub-lite/dl
          key: hub-lite-dl-${{ matrix.board }}-${{ hashFiles('profiles/hub-lite/upstream.env', format('profiles/hub-lite/boards/{0}/board.env', matrix.board)) }}
      - name: Build the hub-lite image
        run: sh scripts/build-hub-lite.sh "${{ matrix.board }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dockneighbor-os-hub-lite-${{ matrix.board }}
          path: out/hub-lite/${{ matrix.board }}/
          if-no-files-found: error

  # Every board built and passed its image check before anything is signed or published.
  publish:
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends signify-openbsd
      - uses: actions/download-artifact@v4
        with:
          pattern: dockneighbor-os-hub-lite-*
          path: dl
      - name: Sign each board's manifest
        env:
          DN_OS_RELEASE_USIGN_KEY: ${{ secrets.DN_OS_RELEASE_USIGN_KEY }}
          BOARDS: ${{ join(fromJSON(needs.tag.outputs.boards), ' ') }}
        run: |
          set -eu
          [ -n "$DN_OS_RELEASE_USIGN_KEY" ] || { echo "::error::DN_OS_RELEASE_USIGN_KEY is not set"; exit 1; }
          mkdir -p out/hub-lite
          for b in $BOARDS; do
            [ -d "dl/dockneighbor-os-hub-lite-$b" ] || { echo "::error::no build for board $b"; exit 1; }
            mv "dl/dockneighbor-os-hub-lite-$b" "out/hub-lite/$b"
          done
          # signify insists on the <name>.sec naming scheme.
          umask 077; d=$(mktemp -d); trap 'rm -rf "$d"' EXIT; k="$d/dn-os-release.sec"
          printf '%s\n' "$DN_OS_RELEASE_USIGN_KEY" > "$k"
          for b in $BOARDS; do
            sh scripts/release-manifest.sh "$GITHUB_REF_NAME" "$k" "$b"
            cp "out/hub-lite/$b/manifest.json" "out/hub-lite/$b.json"
            cp "out/hub-lite/$b/manifest.json.sig" "out/hub-lite/$b.json.sig"
          done
          cat out/hub-lite/*/SHA256SUMS > out/hub-lite/SHA256SUMS
      - name: Publish the release, then move the channel to it
        env:
          GH_TOKEN: ${{ github.token }}
          BOARDS: ${{ join(fromJSON(needs.tag.outputs.boards), ' ') }}
        run: |
          set -eu
          root=$PWD; . scripts/hub-lite-board.sh
          titles=$(for b in $BOARDS; do (hub_lite_load "$b" && printf '%s, ' "$BOARD_TITLE"); done)
          . profiles/hub-lite/profile.env
          cd out/hub-lite
          gh release create "$GITHUB_REF_NAME" --title "DockNeighbor OS hub-lite $DN_OS_VERSION" \
            --notes "${titles%, }. One signed manifest per board, <device>.json. Verify: \`signify -V -p dn-os-release.pub -m <device>.json\` then the image's sha256 in it." \
            ./*/*.bin SHA256SUMS ./*.json ./*.json.sig
          gh release view channel-hub-lite >/dev/null 2>&1 || gh release create channel-hub-lite --latest=false \
            --title "hub-lite channel (rolling)" --notes "The signed manifests routers read for full-OS upgrades, one per board (<device>.json). Overwritten by each release."
          # Every manifest, then every signature: a router that reads a new manifest before its signature fails
          # closed and retries.
          for b in $BOARDS; do gh release upload channel-hub-lite "$b.json" --clobber; done
          for b in $BOARDS; do gh release upload channel-hub-lite "$b.json.sig" --clobber; done
