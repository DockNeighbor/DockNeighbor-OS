# Two uplinks on one network (e.g. the WAN port AND the Wi-Fi client both on the boat's LAN) must not answer ARP
# for each other's address ("ARP flux"): the peer then sends to the wrong port and hits the wrong firewall zone.
# Found on the bench MT300N-V2, 2026-09-25: its Wi-Fi uplink's address answered from the wired WAN, whose wan zone
# refused SSH. arp_ignore=1: answer only on the interface that holds the address.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
